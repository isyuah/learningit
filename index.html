<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="知学 · 开箱即用的教学网站模板：React + Tailwind CSS v4，自带教学组件库与 LLM 友好文档。"
    />
    <meta name="theme-color" content="#F7F8FA" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%235041D2'/%3E%3Ctext x='32' y='45' text-anchor='middle' font-size='38' font-weight='600' fill='%23FFFFFF' font-family='sans-serif'%3E%E7%9F%A5%3C/text%3E%3C/svg%3E"
    />
    <title>知学 · 教学网站模板</title>
    <script>
      // 主题初始化：避免刷新时暗色模式闪烁（flash of incorrect theme）
      (function () {
        try {
          var stored = localStorage.getItem("lt-theme");
          var dark =
            stored === "dark" ||
            (!stored && window.matchMedia("(prefers-color-scheme: dark)").matches);
          if (dark) document.documentElement.classList.add("dark");
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
